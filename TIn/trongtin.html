<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin cá nhân</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
            background-color: #f4f4f4;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            display: inline-block;
            max-width: 400px;
            width: 100%;
            transition: transform 0.3s ease-in-out;
        }
        .container:hover {
            transform: scale(1.05);
        }
        img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #3498db;
        }
        h1 {
            color: #2c3e50;
        }
        p {
            font-size: 16px;
            color: #555;
            margin: 8px 0;
        }
        .info {
            background: #3498db;
            color: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Thông tin cá nhân</h1>
        <img src="your-image.jpg" alt="Ảnh cá nhân">
        <div class="info">
            <p><strong>Họ và tên:</strong> Đỗ Trọng Tín</p>
            <p><strong>Email:</strong> dotin.061003@gmail.com</p>
            <p><strong>Số điện thoại:</strong> 0976785928</p>
            <p><strong>MSSV:</strong> 2180608101</p>
        </div>
    </div>
</body>
</html>
